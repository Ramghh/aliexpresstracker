<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تتبع الطرود | AliExpress Style</title>
    <!-- Font Awesome 6 (مجاني للأيقونات) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tahoma', system-ui, -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background-color: #0a0c10;
            color: #eef2ff;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }

        /* الحاوية الرئيسية */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: #0f1117;
            border-radius: 28px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.6);
            padding: 1.8rem 1.5rem 2rem;
            border: 1px solid rgba(255, 107, 0, 0.2);
        }

        /* الرأس + الإجمالي */
        .header-area {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #2a2e3a;
            padding-bottom: 1.2rem;
        }

        .title h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FF6B00, #ff9142);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
        }

        .title p {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 5px;
        }

        /* بطاقة الإجمالي */
        .total-card {
            background: #1a1d26;
            border-radius: 32px;
            padding: 0.8rem 1.5rem;
            display: flex;
            gap: 1.8rem;
            flex-wrap: wrap;
            justify-content: center;
            border-left: 3px solid #FF6B00;
            box-shadow: 0 8px 16px -6px rgba(0,0,0,0.4);
        }

        .total-item {
            text-align: center;
        }

        .total-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b9c3db;
        }

        .total-amount {
            font-size: 1.9rem;
            font-weight: 800;
            color: #FF6B00;
            line-height: 1.2;
        }

        .total-amount small {
            font-size: 0.9rem;
            font-weight: 500;
            color: #cbd5e6;
        }

        /* أزرار JSON */
        .json-actions {
            display: flex;
            gap: 0.8rem;
        }

        .json-btn {
            background: #262b36;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: #FFE8D9;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .json-btn i {
            color: #FF6B00;
        }

        .json-btn:hover {
            background: #FF6B00;
            color: #0f1117;
            transform: translateY(-2px);
        }

        .json-btn:hover i {
            color: #0f1117;
        }

        /* نموذج الإضافة */
        .add-form {
            background: #13161f;
            border-radius: 32px;
            padding: 1.2rem 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 1rem;
            border: 1px solid #2c2f3a;
        }

        .form-group {
            flex: 1;
            min-width: 140px;
        }

        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #FFB27A;
            margin-bottom: 0.3rem;
            letter-spacing: 0.3px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: #20232e;
            border: 1px solid #353a48;
            padding: 0.7rem 1rem;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: #FF6B00;
            box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.3);
        }

        .btn-add {
            background: #FF6B00;
            border: none;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: bold;
            color: #0f1117;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            margin-top: 1.2rem;
        }

        .btn-add:hover {
            background: #ff8733;
            transform: scale(1.02);
            box-shadow: 0 6px 14px rgba(255, 107, 0, 0.3);
        }

        /* حاوية الجدول */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 24px;
            background: #0c0f16;
            margin-top: 0.5rem;
        }

        .track-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            min-width: 550px;
        }

        .track-table th {
            text-align: right;
            padding: 1rem 1rem;
            background: #1a1e28;
            color: #FFB27A;
            font-weight: 600;
            border-bottom: 1px solid #2d313e;
        }

        .track-table td {
            padding: 1rem 1rem;
            border-bottom: 1px solid #22262f;
            vertical-align: middle;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1e232f;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: #ff6b6b;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            padding: 6px 8px;
            border-radius: 50%;
        }

        .delete-btn:hover {
            background: #2a1c1c;
            color: #ff3a3a;
            transform: scale(1.1);
        }

        .price-style {
            font-weight: 600;
            color: #FFB27A;
        }

        /* استجابة للهواتف */
        @media (max-width: 780px) {
            body {
                padding: 0.8rem;
            }
            .container {
                padding: 1rem;
            }
            .header-area {
                flex-direction: column;
                align-items: stretch;
            }
            .total-card {
                justify-content: space-between;
            }
            .add-form {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-add {
                margin-top: 0.5rem;
                justify-content: center;
            }
            .track-table th, .track-table td {
                padding: 0.7rem 0.8rem;
                font-size: 0.8rem;
            }
            .total-amount {
                font-size: 1.4rem;
            }
        }

        /* أيقونات صغيرة */
        .fa-trash-alt, .fa-file-export, .fa-file-import {
            pointer-events: none;
        }

        footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.7rem;
            color: #5f6a7a;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- رأس الصفحة + الإجمالي + ازرار json -->
    <div class="header-area">
        <div class="title">
            <h1><i class="fas fa-box-open" style="color:#FF6B00; margin-left: 8px;"></i>AliTrack</h1>
            <p>تتبع الطرود • شحن سريع • AliExpress style</p>
        </div>
        <div class="total-card">
            <div class="total-item">
                <div class="total-label">💰 إجمالي الإنفاق (USD)</div>
                <div class="total-amount" id="totalUSD">$0.00</div>
            </div>
            <div class="total-item">
                <div class="total-label">💶 إجمالي الإنفاق (EUR)</div>
                <div class="total-amount" id="totalEUR">€0.00</div>
            </div>
        </div>
        <div class="json-actions">
            <button class="json-btn" id="exportBtn"><i class="fas fa-download"></i> تصدير JSON</button>
            <button class="json-btn" id="importBtn"><i class="fas fa-upload"></i> استيراد JSON</button>
            <input type="file" id="importFileInput" accept=".json" style="display: none;">
        </div>
    </div>

    <!-- نموذج إضافة منتج جديد -->
    <div class="add-form">
        <div class="form-group">
            <label><i class="fas fa-tag"></i> اسم المنتج / وصف الطرد</label>
            <input type="text" id="productName" placeholder="مثال: سماعات بلوتوث" autocomplete="off">
        </div>
        <div class="form-group">
            <label><i class="fas fa-dollar-sign"></i> السعر (USD)</label>
            <input type="number" id="productPrice" step="0.01" placeholder="0.00" value="0.00">
        </div>
        <div class="form-group">
            <label><i class="fas fa-truck-fast"></i> حالة الشحن</label>
            <select id="productStatus">
                <option value="في الطريق">🚚 في الطريق</option>
                <option value="في الجمارك">🛃 في الجمارك</option>
                <option value="تم التوصيل">✅ تم التوصيل</option>
            </select>
        </div>
        <button class="btn-add" id="addProductBtn"><i class="fas fa-plus-circle"></i> إضافة طرد</button>
    </div>

    <!-- جدول الطرود -->
    <div class="table-wrapper">
        <table class="track-table" id="trackingTable">
            <thead>
                <tr>
                    <th>المنتج / الوصف</th>
                    <th>السعر ($)</th>
                    <th>حالة الشحن</th>
                    <th style="width: 60px;"></th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- سيتم تعبئته بواسطة JavaScript -->
                <tr><td colspan="4" style="text-align:center;">جاري تحميل البيانات...</td></tr>
            </tbody>
        </table>
    </div>
    <footer>
        <i class="fas fa-moon"></i> وضع ليلي | أيقونات تعبيرية لكل حالة | دعم عملات USD / EUR بسعر صرف 1 USD = 0.92 EUR
    </footer>
</div>

<script>
    // ------------------- التهيئة و المتغيرات -------------------
    // سعر صرف ثابت (1 دولار = 0.92 يورو)
    const EXCHANGE_RATE = 0.92;

    // مصفوفة الطرود الرئيسية
    let parcels = [];

    // ID تلقائي متزايد
    let nextId = 1;

    // دالة لتعيين أيقونة تعبيرية لكل حالة (حتى الحالات الإضافية مثل تم الشحن، قيد الانتظار، تم الاستلام)
    function getStatusIcon(statusText) {
        const statusMap = {
            "في الطريق": "🚚",
            "في الجمارك": "🛃",
            "تم التوصيل": "✅",
            "تم الشحن": "✈️",
            "قيد الانتظار": "⏳",
            "تم الاستلام": "📦✅",
            "شحن": "📦",
        };
        // البحث المباشر
        if (statusMap[statusText]) return statusMap[statusText];
        // إرجاع أيقونة افتراضية إذا كانت حالة غير متوقعة
        return "📦";
    }

    // دالة عرض الجدول بالكامل مع أيقونات وحذف
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;

        if (parcels.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; padding:2rem;">📭 لا توجد طرود بعد، أضف طرداً جديداً</td></tr>`;
            return;
        }

        let html = '';
        for (let p of parcels) {
            const icon = getStatusIcon(p.status);
            // عرض الحالة مع النص والأيقونة
            const statusDisplay = `<div class="status-badge"><span style="font-size:1.2rem;">${icon}</span> ${p.status}</div>`;
            html += `
                <tr data-id="${p.id}">
                    <td><strong>${escapeHtml(p.name)}</strong></td>
                    <td class="price-style">$${p.price.toFixed(2)}</td>
                    <td>${statusDisplay}</td>
                    <td><button class="delete-btn" data-id="${p.id}" title="حذف الطرد"><i class="fas fa-trash-alt"></i></button></td>
                </tr>
            `;
        }
        tbody.innerHTML = html;

        // إضافة مستمعي أحداث الحذف لكل زر
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const id = parseInt(btn.getAttribute('data-id'));
                deleteParcelById(id);
            });
        });
    }

    // دالة لحماية النصوص من XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // تحديث إجمالي الإنفاق بالدولار واليورو
    function updateTotalSpending() {
        const totalUSD = parcels.reduce((sum, p) => sum + p.price, 0);
        const totalEUR = totalUSD * EXCHANGE_RATE;
        const usdElement = document.getElementById('totalUSD');
        const eurElement = document.getElementById('totalEUR');
        if (usdElement) usdElement.innerHTML = `$${totalUSD.toFixed(2)}`;
        if (eurElement) eurElement.innerHTML = `€${totalEUR.toFixed(2)}`;
    }

    // حذف طرد حسب id
    function deleteParcelById(id) {
        parcels = parcels.filter(p => p.id !== id);
        // إعادة حساب nextId إن أمكن (لكن ليس ضروريا)
        if (parcels.length > 0) {
            const maxId = Math.max(...parcels.map(p => p.id));
            nextId = maxId + 1;
        } else {
            nextId = 1;
        }
        renderTable();
        updateTotalSpending();
    }

    // إضافة منتج جديد
    function addNewProduct(name, price, status) {
        if (!name || name.trim() === "") {
            alert("❌ الرجاء إ填写 اسم المنتج أو وصف الطرد");
            return false;
        }
        let priceNum = parseFloat(price);
        if (isNaN(priceNum) || priceNum < 0) {
            alert("⚠️ السعر غير صالح، أدخل رقماً موجباً");
            return false;
        }
        // التأكد من أن الحالة ضمن المتاح (يمكن أن تكون من القائمة المنسدلة أو أي حالة)
        const newParcel = {
            id: nextId++,
            name: name.trim(),
            price: priceNum,
            status: status,
        };
        parcels.push(newParcel);
        renderTable();
        updateTotalSpending();
        return true;
    }

    // تصدير البيانات إلى ملف JSON
    function exportToJSON() {
        if (parcels.length === 0) {
            alert("📭 لا توجد بيانات لتصديرها، أضف بعض الطرود أولاً.");
            return;
        }
        const dataStr = JSON.stringify(parcels, null, 2);
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `parcels_${new Date().toISOString().slice(0,19)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    // استيراد البيانات من ملف JSON (يحل محل الجدول الحالي)
    function importFromJSON(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const importedData = JSON.parse(evt.target.result);
                if (!Array.isArray(importedData)) {
                    throw new Error("الملف لا يحتوي على مصفوفة صحيحة");
                }
                // التحقق من صحة الحقول الأساسية لكل عنصر
                let validParcels = [];
                let maxIdFound = 0;
                for (let item of importedData) {
                    if (item.name && typeof item.name === 'string' && 
                        typeof item.price === 'number' && 
                        item.status && typeof item.status === 'string') {
                        // تأكد من صحة السعر
                        let priceValid = item.price >= 0;
                        if (priceValid) {
                            const newItem = {
                                id: (typeof item.id === 'number' && item.id > 0) ? item.id : maxIdFound + 1,
                                name: item.name,
                                price: item.price,
                                status: item.status,
                            };
                            if (newItem.id > maxIdFound) maxIdFound = newItem.id;
                            validParcels.push(newItem);
                        } else {
                            console.warn("سعر غير صالح لـ :", item.name);
                        }
                    } else {
                        console.warn("عنصر غير مكتمل، تم تخطيه:", item);
                    }
                }
                if (validParcels.length === 0) {
                    alert("⚠️ الملف لا يحتوي على بيانات صالحة (تأكد من وجود name, price, status)");
                    return;
                }
                // ترتيب المصفوفة وضمان عدم تداخل id
                // إعادة تعيين ids متسقة
                let sortedById = [...validParcels].sort((a,b) => a.id - b.id);
                let newParcels = [];
                let currentId = 1;
                for (let p of sortedById) {
                    newParcels.push({
                        ...p,
                        id: currentId++
                    });
                }
                parcels = newParcels;
                nextId = currentId;
                renderTable();
                updateTotalSpending();
                alert(`✅ تم استيراد ${parcels.length} طرد بنجاح.`);
            } catch (err) {
                console.error(err);
                alert("❌ خطأ في قراءة ملف JSON: تأكد من صيغته");
            }
        };
        reader.onerror = () => alert("خطأ في قراءة الملف");
        reader.readAsText(file);
    }

    // ------------------- تهيئة البيانات الافتراضية (تلبية متطلبات الجدول: تم الشحن، قيد الانتظار، تم الاستلام) -------------------
    function loadDefaultData() {
        // عينات مطابقة للطلب: تم الشحن، قيد الانتظار، تم الاستلام وأيضاً حالات القائمة المنسدلة (في الطريق، الجمارك، تم التوصيل)
        const defaultParcels = [
            { id: 1, name: "📱 هاتف شاومي 12", price: 299.99, status: "تم الشحن" },
            { id: 2, name: "🎧 سماعة لاسلكية Pro", price: 45.50, status: "قيد الانتظار" },
            { id: 3, name: "⌚ ساعة ذكية رياضية", price: 89.99, status: "تم الاستلام" },
            { id: 4, name: "📦 شاحن سريع 65W", price: 25.99, status: "في الطريق" },
            { id: 5, name: "🛃 حقيبة ظهر عصرية", price: 39.90, status: "في الجمارك" },
            { id: 6, name: "🏠 طقم أواني منزلي", price: 119.00, status: "تم التوصيل" }
        ];
        parcels = defaultParcels.map(p => ({ ...p }));
        nextId = parcels.length > 0 ? Math.max(...parcels.map(p => p.id)) + 1 : 1;
        renderTable();
        updateTotalSpending();
    }

    // ------------------- ربط الأحداث -------------------
    document.addEventListener('DOMContentLoaded', () => {
        // تحميل البيانات الافتراضية
        loadDefaultData();

        // زر إضافة منتج
        const addBtn = document.getElementById('addProductBtn');
        const nameInput = document.getElementById('productName');
        const priceInput = document.getElementById('productPrice');
        const statusSelect = document.getElementById('productStatus');

        addBtn.addEventListener('click', () => {
            const name = nameInput.value.trim();
            let price = priceInput.value.trim();
            const status = statusSelect.value;
            if (name === "") {
                alert("✏️ من فضلك أدخل اسم المنتج أو وصف الطرد");
                nameInput.focus();
                return;
            }
            let priceNum = parseFloat(price);
            if (isNaN(priceNum) || priceNum < 0) {
                alert("💰 السعر يجب أن يكون رقماً موجباً (مثال: 49.99)");
                priceInput.value = "";
                priceInput.focus();
                return;
            }
            addNewProduct(name, priceNum, status);
            // مسح الحقول مع إبقاء السعر لسهولة الإضافة
            nameInput.value = "";
            priceInput.value = "";
            nameInput.focus();
        });

        // تصدير JSON
        const exportBtn = document.getElementById('exportBtn');
        exportBtn.addEventListener('click', exportToJSON);

        // استيراد JSON
        const importBtn = document.getElementById('importBtn');
        const fileInput = document.getElementById('importFileInput');
        importBtn.addEventListener('click', () => {
            fileInput.click();
        });
        fileInput.addEventListener('change', (event) => {
            if (event.target.files && event.target.files.length > 0) {
                const selectedFile = event.target.files[0];
                importFromJSON(selectedFile);
                fileInput.value = ''; // إعادة تعيين لتكرار استيراد نفس الملف
            }
        });
    });
</script>
</body>
</html>
